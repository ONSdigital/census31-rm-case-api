name: Case API OpenAPI Document Generation CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  generate-openapi-spec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository Code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Maven dependencies and integration-test images are in Artifact Registry.
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_CI_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Log in to Google Docker Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-west2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up JDK 21 Runtime.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Node is required by the doc converters run from DocumentationGeneratorIT.
      # Pinned explicitly because @redocly/cli 2.x requires Node >= 22.12 — we no
      # longer rely on whatever happens to be preinstalled on the runner image.
      - name: Set up Node.js Runtime.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Docker network
        run: docker network create censusrmdockerdev_default

      - name: Verify Spotless Formatting and PMD Rules.
        run: mvn spotless:check pmd:check

      - name: Build Package and Extract OpenAPI Spec.
        run: mvn clean verify -Dcontainer.cli=docker

      # Structural OpenAPI lint (broken refs, invalid schemas, missing responses),
      # not just a JSON syntax check. Version MUST stay in sync with the
      # REDOCLY_CLI constant in DocumentationGeneratorIT.java.
      - name: Validate OpenAPI JSON and derived docs.
        run: |
          for f in openapi.json openapi.md openapi.html; do
            if [ ! -f "api-docs/$f" ]; then
              echo "::error::api-docs/$f was not generated"
              exit 1
            fi
          done
          npx --yes @redocly/cli@2.43.2 lint api-docs/openapi.json
          echo "OpenAPI spec passed lint"

      # The contract gate: api-docs/openapi.json is source of truth and MUST be
      # committed in sync with endpoint/model changes.
      - name: Fail if committed OpenAPI JSON is stale.
        run: |
          if ! git ls-files --error-unmatch api-docs/openapi.json >/dev/null 2>&1; then
            echo "::error::api-docs/openapi.json must be committed to the repository"
            exit 1
          fi

          if [ -n "$(git status --porcelain -- api-docs/openapi.json)" ]; then
            echo "::error::Committed api-docs/openapi.json does not match freshly generated output."
            echo "Out-of-sync files:"
            git status --porcelain -- api-docs/openapi.json
            git --no-pager diff -- api-docs/openapi.json
            echo ""
            echo "Fix: run 'mvn clean verify' locally and commit the regenerated api-docs/openapi.json"
            exit 1
          fi
          echo "Committed OpenAPI JSON is in sync with the code"

      - name: Publish Generated OpenAPI Specification Artifacts.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: rm-case-api-openapi-specs
          path: api-docs/
          if-no-files-found: warn

      - name: Print Artifact Download Info.
        if: always()
        run: |
          echo "Source of truth: endpoint/model code + committed api-docs/openapi.json"
          echo "Derived artifacts: api-docs/openapi.md and api-docs/openapi.html"
