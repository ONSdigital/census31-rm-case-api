server:
  port: 8161

info:
  app:
    name: Case API
    version: 1.0

spring:
  application:
    name: Case API
  datasource:
    url: jdbc:postgresql://localhost:5432/rm?readOnly=true
    username: appuser
    password: postgres
    driverClassName: org.postgresql.Driver
    hikari:
      maximumPoolSize: 50
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cases
        jdbc:
          lob:
            non_contextual_creation: true
  cloud:
    gcp:
      pubsub:
        emulator-host: localhost:8538
        project-id: our-project
        subscriber:
          flow-control:
            max-outstanding-element-count: 100

  jackson:
    # Boot 4 migration: freeze the wire format at Jackson 2 behaviour so this
    # release changes no API contract. Jackson 3 defaults would re-order every
    # response alphabetically. Keep the existing ISO-8601 java.time output from
    # the shared ObjectMapperFactory. REMOVE in H2 2027 as its own announced
    # change.
    use-jackson2-defaults: true

logging:
  profile: DEV
  level:
    root: INFO
    com.google.cloud.spring.pubsub.integration.inbound.PubSubInboundChannelAdapter: ERROR

exceptionmanager:
  connection:
    scheme: http
    host: localhost
    port: 8666

management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true

  metrics:
    tags:
      application: Case API
      pod: ${HOSTNAME}
  stackdriver:
    metrics:
      export:
        project-id: dummy-project-id
        enabled: false
        step: PT1M

uacservice:
  connection:
    scheme: http
    host: localhost
    port: 8164


queueconfig:
  questionnaire-link-topic: rm-internal-questionnaire-uac-linked
  questionnaire-link-subcription: rm-internal-questionnaire-uac-linked-service